<section class="slide" data-index="8" aria-label="第 9 页"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="证据支持到哪里，结论就写到哪里"><title>证据支持到哪里，结论就写到哪里</title><defs></defs><rect x="0" y="0" width="1280" height="720" fill="#F5F3EF"/><rect data-object-id="S09/top-rule" x="0" y="0" width="1280" height="7" rx="0" fill="#315B70" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text data-object-id="S09/footer-label" font-family="Noto Sans CJK SC" font-size="13" font-weight="400" fill="#607080" text-anchor="start"><tspan x="52" y="695.48">学术研究汇报</tspan></text><text data-object-id="S09/page-number" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#607080" text-anchor="end"><tspan x="1228" y="694.4">09 / 09</tspan></text><text data-object-id="S09/kicker" font-family="Noto Sans CJK SC" font-size="15" font-weight="700" fill="#527F7E" text-anchor="start"><tspan x="52" y="44.4">参考文献 · 来源与版本</tspan></text><text data-object-id="S09/title" font-family="Noto Sans CJK SC" font-size="37" font-weight="700" fill="#243648" text-anchor="start"><tspan x="52" y="100.52">证据支持到哪里，结论就写到哪里</tspan></text><line data-object-id="S09/header-rule" x1="52" y1="164" x2="1228" y2="164" stroke="#CFD7DA" stroke-width="1.4"/><text data-object-id="S09/ref:P1:id" font-family="Noto Sans CJK SC" font-size="21" font-weight="700" fill="#527F7E" text-anchor="start"><tspan x="52" y="210.16">P1</tspan></text><text data-object-id="S09/ref:P1:title" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#243648" text-anchor="start"><tspan x="138" y="213.88">A conversational multi-agent AI system for automated plant phenotyping</tspan></text><text data-object-id="S09/ref:P1:meta" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#607080" text-anchor="start"><tspan x="138" y="303.28">Chen F., Stogiannidis I., Wood A., et al. · Nature Communications 17, 6391 · 2026 · DOI: 10.1038/s41467-026-71090-y ·</tspan><tspan x="138" y="326.32">Version of Record · updated 2026-07-16</tspan></text><line data-object-id="S09/ref:P1:detail-rule" x1="138" y1="388" x2="1228" y2="388" stroke="#CFD7DA" stroke-width="1.4"/><text data-object-id="S09/ref:P1:url" font-family="Noto Sans CJK SC" font-size="19" font-weight="400" fill="#315B70" text-anchor="start"><tspan x="138" y="426.24">https://www.nature.com/articles/s41467-026-71090-y</tspan></text><text data-object-id="S09/ref:P1:reading" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#607080" text-anchor="start"><tspan x="138" y="484.2">全文阅读：Design · Case studies · Evaluation · Discussion · Methods</tspan></text><text data-object-id="S09/ref:P1:assets" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#607080" text-anchor="start"><tspan x="138" y="571.28">原图授权：Fig. 3 · CC BY 4.0</tspan></text></svg></section></main><aside id="notes" hidden></aside><script>
  const pages=[{"title":"AI 智能体怎样进入\n植物表型研究？","notes":"今天用一篇真实的 Nature Communications 研究，讨论三个问题：智能体把哪些分析环节串了起来；现有结果究竟证明了什么；以及我们怎样从失败案例中提出一个可检验的研究切入口。这是一个单篇论文的七分钟示例，重点是证据组织和研究判断。文中的表型分析能力与灌溉、施肥或产量控制，属于不同的验证对象。\n\n参考文献（完整题名）\nP1 · A conversational multi-agent AI system for automated plant phenotyping · Nature Communications 17, 6391 · 2026 · 10.1038/s41467-026-71090-y · Version of Record · updated 2026-07-16","seconds":30},{"title":"先确认这项研究解决了什么问题","notes":"论文的完整题名在这里。PhenoAssistant 的主要对象，是植物表型分析流程：用户通过自然语言提出问题，系统选择合适的视觉模型和分析工具，并组织后续处理。阅读这篇研究时，首先要限定验证对象。它展示了图像到表型再到统计解释的连接，也进行了任务评价；但这不能直接变成农业生产中的灌溉、施肥或增产结论。右侧把这个边界单独写出，是为了让后续数字有明确的适用范围。\n\n参考文献（完整题名）\nP1 · A conversational multi-agent AI system for automated plant phenotyping · Nature Communications 17, 6391 · 2026 · 10.1038/s41467-026-71090-y · Version of Record · updated 2026-07-16","seconds":40},{"title":"把自然语言转为可复用分析流程","notes":"这张图依据原文重新绘制，所有文字和连线都可编辑。用户先给出任务目标，中央 manager 负责分解和编排，实际计算由工具库完成。这个工具库既包括植物专用视觉模型，也包括统计、绘图和文献检索等能力。最后输出表型数据、图形和解释，并能够保存执行过的流程，再用于相似数据。这里值得关注的是语言交互与专门工具的协同：manager 的选择是否合理，以及工具的输出是否可靠，必须分开评价。\n\n参考文献（完整题名）\nP1 · A conversational multi-agent AI system for automated plant phenotyping · Nature Communications 17, 6391 · 2026 · 10.1038/s41467-026-71090-y · Version of Record · updated 2026-07-16","seconds":60},{"title":"案例：24 株植物的重复成像分析","notes":"左边是论文的完整 Figure 3，没有裁掉任何面板。因为原图是竖向多任务图，汇报时用它定位流程，不要求听众逐字阅读原图中的小字；右边给出可编辑的解读。数据包含二十四株植物、五个生态型、二十六天，共一千二百四十八幅图像。这个数是重复观测的图像量，不能当成独立植物样本数。读图时，灰色表示任务，蓝色表示工具，白色表示结果，依次看到表型提取、绘图、读图、统计检验和文献对照。\n\n参考文献（完整题名）\nP1 · A conversational multi-agent AI system for automated plant phenotyping · Nature Communications 17, 6391 · 2026 · 10.1038/s41467-026-71090-y · Version of Record · updated 2026-07-16","seconds":65},{"title":"20 项分析任务：17 项通过人工核查","notes":"下面看一个容易被误读的结果。论文用实际数据设计了二十项分析任务，人工检查输出后，十七项被判定为正确，三项失败。图中的柱形是依据原文计数重绘的可编辑图表，分母是任务数。三项失败都发生在需要精细读取图表的任务上。这提示，系统能把流程跑通，并不意味着每一步的细节解释都正确。也不能把这个比例写成农业栽培成功率，因为这些任务没有评价田间灌溉、施肥或产量控制。\n\n参考文献（完整题名）\nP1 · A conversational multi-agent AI system for automated plant phenotyping · Nature Communications 17, 6391 · 2026 · 10.1038/s41467-026-71090-y · Version of Record · updated 2026-07-16","seconds":55},{"title":"从表型分析走向栽培控制，还缺什么？","notes":"这些结果提供了很有价值的起点，也留下了三个层面的边界。首先是工具覆盖：哪些作物、哪些任务和成像条件有相应工具？其次是分布外场景：当新数据与原有模型的适用范围不一致，系统还能否可靠工作？最后是农业决策收益：要证明它改善施肥、灌溉或产量，需要另外设计真实的控制与效果验证。因此研究讨论中应同时写明适用范围、失败案例和用户核查机制。\n\n参考文献（完整题名）\nP1 · A conversational multi-agent AI system for automated plant phenotyping · Nature Communications 17, 6391 · 2026 · 10.1038/s41467-026-71090-y · Version of Record · updated 2026-07-16","seconds":50},{"title":"切入口：为图表读数加一道核验","notes":"基于细粒度读图错误，我们提出一个范围明确的研究问题：在保留 manager 工具编排的条件下，增加图表读数核验，能否降低关键错误？一种待检验的做法，是把关键读数与结构化源数据对照，在不一致或无法追溯时触发人工复核，并保留核验记录。这里的措辞是研究假说，而不是已证实的改进。我们也不能只考察错误减少多少，还要计算人工复核发生得多不多、是否增加了不可接受的工作负担。\n\n参考文献（完整题名）\nP1 · A conversational multi-agent AI system for automated plant phenotyping · Nature Communications 17, 6391 · 2026 · 10.1038/s41467-026-71090-y · Version of Record · updated 2026-07-16","seconds":50},{"title":"验证改进时，锁定工具、数据与比较条件","notes":"最后，把研究想法落到比较设计上。预先定义同一组表型分析任务，让固定工作流与 manager 编排在相同工具、数据、信息和预算下运行。然后用预先规定的关键错误标准进行核查，最好让评价者不知道结果来自哪种设置。在这个基础上，再检验核验模块与风险触发人工复核带来的变化。主要观察错误率，同时记录复核比例和耗时。先把这些评价规则写清楚，才能分辨改进来自编排策略、额外工具，还是更多人工投入。\n\n参考文献（完整题名）\nP1 · A conversational multi-agent AI system for automated plant phenotyping · Nature Communications 17, 6391 · 2026 · 10.1038/s41467-026-71090-y · Version of Record · updated 2026-07-16","seconds":55},{"title":"证据支持到哪里，结论就写到哪里","notes":"这页给出完整书目、官方链接、阅读范围和原图授权。今天的核心判断是：多智能体已经把多类表型工具接成可交互分析流程，关键结果仍需按评价任务理解。新的研究切入口，应从明确的失败类型出发，并同时检验错误与人工负担。\n\n参考文献（完整题名）\nP1 · A conversational multi-agent AI system for automated plant phenotyping · Nature Communications 17, 6391 · 2026 · 10.1038/s41467-026-71090-y · Version of Record · updated 2026-07-16","seconds":15}];let index=0;const frames=[...document.querySelectorAll('.slide')],notes=document.getElementById('notes');
  function go(i){index=Math.max(0,Math.min(frames.length-1,i));frames.forEach((f,j)=>f.classList.toggle('active',j===index));document.getElementById('counter').textContent=(index+1)+' / '+frames.length;notes.textContent=pages[index].title+'\n\n'+(pages[index].notes||'本页没有讲稿备注。');history.replaceState(null,'','#slide-'+(index+1))}
  document.getElementById('prev').onclick=()=>go(index-1);document.getElementById('next').onclick=()=>go(index+1);document.getElementById('overview').onclick=()=>document.body.classList.toggle('overview');document.getElementById('show-notes').onclick=()=>notes.hidden=!notes.hidden;document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();frames.forEach((f,i)=>f.onclick=()=>{if(document.body.classList.contains('overview')){document.body.classList.remove('overview');go(i)}});document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(index+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(index-1)}if(e.key.toLowerCase()==='g')document.body.classList.toggle('overview');if(e.key.toLowerCase()==='s')notes.hidden=!notes.hidden;if(e.key==='Escape'){notes.hidden=true;document.body.classList.remove('overview')}});go((Number(location.hash.replace('#slide-',''))||1)-1);
  </script></body></html>
