<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="从观测误差到站点层面的比较"><title>从观测误差到站点层面的比较</title><defs></defs><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><text data-object-id="evidence-synthesis-2/page-number" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#5A606D" text-anchor="end"><tspan x="1232" y="703.28">02 / 02</tspan></text><text data-object-id="evidence-synthesis-2/section-label" font-family="Noto Sans CJK SC" font-size="26" font-weight="700" fill="#465477" text-anchor="start"><tspan x="48" y="38.96">03  分析单位与边界</tspan></text><text data-object-id="evidence-synthesis-2/title" font-family="Noto Serif CJK SC" font-size="42" font-weight="700" fill="#2A2D38" text-anchor="start"><tspan x="48" y="98.32">从观测误差到站点层面的比较</tspan></text><text data-object-id="evidence-synthesis-2/kicker" font-family="Noto Serif CJK SC" font-size="28" font-weight="400" fill="#5A606D" text-anchor="start"><tspan x="48" y="138.34">教学构造数据，非真实科研结果</tspan></text><line data-object-id="evidence-synthesis-2/header-rule" x1="48" y1="155.06" x2="1232" y2="155.06" stroke="#C2C7D3" stroke-width="1"/><line data-object-id="evidence-synthesis-2/header-accent" x1="48" y1="155.06" x2="172" y2="155.06" stroke="#465477" stroke-width="1.6"/><text data-object-id="evidence-synthesis-2/drawing/study-qualification/e1" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#526170" text-anchor="start"><tspan x="48" y="631.28">共 24 个构造观测，聚合为 4 个站点差值；95% t 区间以站点为统计单位</tspan></text><text data-object-id="evidence-synthesis-2/drawing/study-qualification/e2" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#526170" text-anchor="start"><tspan x="48" y="659.28">仅演示统计与排版；未训练模型，不能推断真实跨站点泛化</tspan></text><g data-object-id="evidence-synthesis-2/data-table" role="table" aria-label="协议之间可比的是误差定义；划分方式不同不能混为同一验证。"><rect x="48" y="171.06" width="620" height="48.16" fill="#FFFFFF"/><text data-cell="0:0" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#2A2D38"><tspan x="58" y="204.94">比较前核对</tspan></text><text data-cell="0:1" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#2A2D38"><tspan x="264.66666666666663" y="204.94">本例约定</tspan></text><line x1="48" y1="219.22" x2="668" y2="219.22" stroke="#2A2D38" stroke-width="1.3"/><rect x="48" y="219.22" width="620" height="48.16" fill="#FFFFFF"/><text data-cell="1:0" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#2A2D38"><tspan x="58" y="253.1">比较对象</tspan></text><text data-cell="1:1" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#2A2D38"><tspan x="264.66666666666663" y="253.1">方法与同协议基线</tspan></text><rect x="48" y="267.38" width="620" height="48.16" fill="#FFFFFF"/><text data-cell="2:0" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#2A2D38"><tspan x="58" y="301.26">指标与单位</tspan></text><text data-cell="2:1" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#2A2D38"><tspan x="264.66666666666663" y="301.26">绝对误差，t/ha</tspan></text><rect x="48" y="315.53999999999996" width="620" height="48.16" fill="#FFFFFF"/><text data-cell="3:0" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#2A2D38"><tspan x="58" y="349.41999999999996">统计单位</tspan></text><text data-cell="3:1" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#2A2D38"><tspan x="264.66666666666663" y="349.41999999999996">4 个站点差值</tspan></text><rect x="48" y="363.69999999999993" width="620" height="48.16" fill="#FFFFFF"/><text data-cell="4:0" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#2A2D38"><tspan x="58" y="397.5799999999999">站点内观测</tspan></text><text data-cell="4:1" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#2A2D38"><tspan x="264.66666666666663" y="397.5799999999999">每站 6 个，共 24 个</tspan></text><line x1="48" y1="411.8599999999999" x2="668" y2="411.8599999999999" stroke="#2A2D38" stroke-width="1.3"/><line x1="48" y1="171.06" x2="668" y2="171.06" stroke="#2A2D38" stroke-width="1.5"/></g><text data-object-id="evidence-synthesis-2/table-caption" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#5A606D" text-anchor="start"><tspan x="48" y="438.06">协议之间可比的是误差定义；划分方式不同不能混为同一验证。</tspan></text><text data-object-id="evidence-synthesis-2/drawing/synthesis-rule/e1" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#202A35" text-anchor="start"><tspan x="720" y="197.94">综合结论保留协议条件</tspan></text><text data-object-id="evidence-synthesis-2/drawing/synthesis-rule/e2" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#202A35" text-anchor="start"><tspan x="720" y="257.22">随机划分：</tspan><tspan x="720" y="291.94000000000005">−0.300 [−0.365, −0.235] t/ha</tspan></text><text data-object-id="evidence-synthesis-2/drawing/synthesis-rule/e3" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#202A35" text-anchor="start"><tspan x="720" y="351.78">整站留出：</tspan><tspan x="720" y="386.5">0.050 [−0.109, 0.209] t/ha</tspan></text><text data-object-id="evidence-synthesis-2/drawing/synthesis-rule/e4" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#202A35" text-anchor="start"><tspan x="720" y="446.34000000000003">跨站点差异不确定。进一步的真实外部验</tspan><tspan x="720" y="481.06000000000006">证仍缺失。</tspan></text></svg>