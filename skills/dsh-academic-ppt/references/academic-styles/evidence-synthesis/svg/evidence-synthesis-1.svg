data-cell="2:1" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#2A2D38"><tspan x="290.91803278688525" y="301.26">1.050</tspan></text><text data-cell="2:2" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#2A2D38"><tspan x="485.016393442623" y="301.26">1.100</tspan></text><text data-cell="2:3" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#2A2D38"><tspan x="679.1147540983607" y="301.26">0.050</tspan></text><text data-cell="2:4" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#2A2D38"><tspan x="873.2131147540983" y="301.26">[−0.109, 0.209]</tspan></text><line x1="48" y1="315.53999999999996" x2="1232" y2="315.53999999999996" stroke="#2A2D38" stroke-width="1.3"/><line x1="48" y1="171.06" x2="1232" y2="171.06" stroke="#2A2D38" stroke-width="1.5"/></g><text data-object-id="evidence-synthesis-1/table-caption" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#5A606D" text-anchor="start"><tspan x="48" y="341.73999999999995">Δ = 方法 − 基线，单位 t/ha。区间以 4 个站点差值计算。</tspan></text><text data-object-id="evidence-synthesis-1/drawing/comparison-verdict/e1" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#245E86" text-anchor="start"><tspan x="48" y="455.94">随机划分</tspan></text><text data-object-id="evidence-synthesis-1/drawing/comparison-verdict/e2" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#202A35" text-anchor="start"><tspan x="48" y="503.94">差值为负，区间未跨零。</tspan><tspan x="48" y="538.66">支持本套数值下误差较低。</tspan></text><text data-object-id="evidence-synthesis-1/drawing/comparison-verdict/e3" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#A35332" text-anchor="start"><tspan x="670" y="455.94">整站留出</tspan></text><text data-object-id="evidence-synthesis-1/drawing/comparison-verdict/e4" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#202A35" text-anchor="start"><tspan x="670" y="503.94">差值略正，区间跨零。</tspan><tspan x="670" y="538.66">不能确认跨站点优势。</tspan></text></svg>