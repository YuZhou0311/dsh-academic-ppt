><text data-cell="3:1" font-family="Noto Serif CJK SC" font-size="28" font-weight="400" fill="#302B2D"><tspan x="179.93548387096774" y="349.41999999999996">−0.350</tspan></text><text data-cell="3:2" font-family="Noto Serif CJK SC" font-size="28" font-weight="400" fill="#302B2D"><tspan x="388.9677419354839" y="349.41999999999996">0.100</tspan></text><line x1="48" y1="363.69999999999993" x2="588" y2="363.69999999999993" stroke="#CDBFC5" stroke-width="0.7"/><rect x="48" y="363.69999999999993" width="540" height="48.16" fill="#FFFFFF"/><text data-cell="4:0" font-family="Noto Serif CJK SC" font-size="28" font-weight="400" fill="#302B2D"><tspan x="58" y="397.5799999999999">D</tspan></text><text data-cell="4:1" font-family="Noto Serif CJK SC" font-size="28" font-weight="400" fill="#302B2D"><tspan x="179.93548387096774" y="397.5799999999999">−0.300</tspan></text><text data-cell="4:2" font-family="Noto Serif CJK SC" font-size="28" font-weight="400" fill="#302B2D"><tspan x="388.9677419354839" y="397.5799999999999">0.100</tspan></text><line x1="48" y1="411.8599999999999" x2="588" y2="411.8599999999999" stroke="#743F4D" stroke-width="1.3"/><line x1="48" y1="171.06" x2="588" y2="171.06" stroke="#743F4D" stroke-width="1.5"/></g><text data-object-id="paper-club-2/table-caption" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" fill="#655B60" text-anchor="start"><tspan x="48" y="438.06">Δ = 方法 − 基线，单位 t/ha；每格来自同站 6 个观测</tspan></text><text data-object-id="paper-club-2/drawing/claim-audit/e1" font-family="Noto Serif CJK SC" font-size="28" font-weight="700" fill="#202A35" text-anchor="start"><tspan x="642" y="197.94">原始信息与讲者判断分开</tspan></text><text data-object-id="paper-club-2/drawing/claim-audit/e2" font-family="Noto Serif CJK SC" font-size="28" font-weight="400" fill="#202A35" text-anchor="start"><tspan x="642" y="260.22">记录：每站 6 个观测。先求站点 MAE，</tspan><tspan x="642" y="294.94000000000005">再计算方法与基线的差值。</tspan></text><text data-object-id="paper-club-2/drawing/claim-audit/e3" font-family="Noto Serif CJK SC" font-size="28" font-weight="400" fill="#202A35" text-anchor="start"><tspan x="642" y="357.78">判断：随机划分差值低于零；</tspan><tspan x="642" y="392.5">整站留出的方向仍不确定。</tspan></text><text data-object-id="paper-club-2/drawing/claim-audit/e4" font-family="Noto Serif CJK SC" font-size="28" font-weight="700" fill="#202A35" text-anchor="start"><tspan x="642" y="455.34">边界：统计单位是站点。24 个观测</tspan><tspan x="642" y="490.05999999999995">不能替代更多独立站点。</tspan></text></svg>