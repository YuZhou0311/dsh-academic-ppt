n></text><text data-cell="4:1" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#252A30"><tspan x="182.19354838709677" y="359.8399999999999">−0.300</tspan></text><text data-cell="4:2" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#252A30"><tspan x="395.0967741935484" y="359.8399999999999">0.100</tspan></text><line x1="48" y1="374.1199999999999" x2="598" y2="374.1199999999999" stroke="#252A30" stroke-width="1.3"/><line x1="48" y1="133.32" x2="598" y2="133.32" stroke="#252A30" stroke-width="1.5"/></g><text data-object-id="research-seminar-2/table-caption" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#59616A" text-anchor="start"><tspan x="48" y="398.4">Δ = 方法 − 基线，单位 t/ha；每格来自同站 6 个观测</tspan></text><text data-object-id="research-seminar-2/drawing/analysis-steps/e1" font-family="Noto Sans CJK SC" font-size="26" font-weight="700" fill="#202A35" text-anchor="start"><tspan x="650" y="158.28">先在站点内求 MAE</tspan></text><text data-object-id="research-seminar-2/drawing/analysis-steps/e2" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#202A35" text-anchor="start"><tspan x="650" y="206.95999999999998">d(s) = MAE方法(s) − MAE基线(s)</tspan></text><text data-object-id="research-seminar-2/drawing/analysis-steps/e3" font-family="Noto Sans CJK SC" font-size="26" font-weight="700" fill="#202A35" text-anchor="start"><tspan x="650" y="260.32">再对 4 个站点差值等权平均</tspan></text><text data-object-id="research-seminar-2/drawing/analysis-steps/e4" font-family="Noto Sans CJK SC" font-size="34" font-weight="400" fill="#202A35" text-anchor="start"><tspan x="650" y="314.76">平均差值 = Σd(s) / 4</tspan></text><text data-object-id="research-seminar-2/drawing/analysis-steps/e5" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#202A35" text-anchor="start"><tspan x="650" y="371.84">95% t 区间：</tspan><tspan x="650" y="406.55999999999995">平均差值 ± 3.182 × SD(d) / 2</tspan></text><text data-object-id="research-seminar-2/drawing/analysis-steps/e6" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#526170" text-anchor="start"><tspan x="650" y="458.56">s 表示站点；仅有 4 个站点。</tspan><tspan x="650" y="488.32">本例无法验证独立性与分布假设。</tspan></text></svg>