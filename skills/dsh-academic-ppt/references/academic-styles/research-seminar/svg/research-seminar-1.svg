</tspan></text><line data-object-id="research-seminar-1/drawing/main-evidence/e4/segment-1" x1="301.018080053846" y1="213.32" x2="403.981919946154" y2="213.32" stroke="#245E86" stroke-width="3"/><line data-object-id="research-seminar-1/drawing/main-evidence/e5/segment-1" x1="301.018080053846" y1="206.32" x2="301.018080053846" y2="220.32" stroke="#245E86" stroke-width="2"/><line data-object-id="research-seminar-1/drawing/main-evidence/e6/segment-1" x1="403.981919946154" y1="206.32" x2="403.981919946154" y2="220.32" stroke="#245E86" stroke-width="2"/><ellipse data-object-id="research-seminar-1/drawing/main-evidence/e7" cx="352.5" cy="213.32" rx="6" ry="6" fill="#245E86" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text data-object-id="research-seminar-1/drawing/main-evidence/e8" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#245E86" text-anchor="start"><tspan x="194" y="254.35999999999999">−0.300 [−0.365, −0.235]</tspan></text><text data-object-id="research-seminar-1/drawing/main-evidence/e9" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#202A35" text-anchor="start"><tspan x="48" y="394.20000000000005">整站留出</tspan></text><line data-object-id="research-seminar-1/drawing/main-evidence/e10/segment-1" x1="503.770565153111" y1="387.16" x2="755.9794348468889" y2="387.16" stroke="#A35332" stroke-width="3"/><line data-object-id="research-seminar-1/drawing/main-evidence/e11/segment-1" x1="503.770565153111" y1="380.16" x2="503.770565153111" y2="394.16" stroke="#A35332" stroke-width="2"/><line data-object-id="research-seminar-1/drawing/main-evidence/e12/segment-1" x1="755.9794348468889" y1="380.16" x2="755.9794348468889" y2="394.16" stroke="#A35332" stroke-width="2"/><ellipse data-object-id="research-seminar-1/drawing/main-evidence/e13" cx="629.875" cy="387.16" rx="6" ry="6" fill="#A35332" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text data-object-id="research-seminar-1/drawing/mai