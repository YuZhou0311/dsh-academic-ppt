<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="从观测误差到站点层面的比较"><title>从观测误差到站点层面的比较</title><defs></defs><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><text data-object-id="methods-whiteboard-2/page-number" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#59616A" text-anchor="end"><tspan x="1232" y="703.28">02 / 02</tspan></text><text data-object-id="methods-whiteboard-2/title" font-family="Noto Serif CJK SC" font-size="40" font-weight="700" fill="#252A30" text-anchor="start"><tspan x="48" y="58.4">从观测误差到站点层面的比较</tspan></text><text data-object-id="methods-whiteboard-2/kicker" font-family="Noto Serif CJK SC" font-size="28" font-weight="400" fill="#59616A" text-anchor="start"><tspan x="48" y="98.07999999999998">教学构造数据，非真实科研结果</tspan></text><text data-object-id="methods-whiteboard-2/drawing/study-qualification/e1" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#526170" text-anchor="start"><tspan x="48" y="631.28">共 24 个构造观测，聚合为 4 个站点差值；95% t 区间以站点为统计单位</tspan></text><text data-object-id="methods-whiteboard-2/drawing/study-qualification/e2" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#526170" text-anchor="start"><tspan x="48" y="659.28">仅演示统计与排版；未训练模型，不能推断真实跨站点泛化</tspan></text><text data-object-id="methods-whiteboard-2/drawing/derivation/e1" font-family="Noto Sans CJK SC" font-size="26" font-weight="700" fill="#202A35" text-anchor="start"><tspan x="48" y="149.76">先在站点内求 MAE</tspan></text><text data-object-id="methods-whiteboard-2/drawing/derivation/e2" font-family="Noto Sans CJK SC" font-size="30" font-weight="400" fill="#202A35" text-anchor="start"><tspan x="48" y="200.35999999999996">d(s) = MAE方法(s) − MAE基线(s)</tspan></text><text data-object-id="methods-whiteboard-2/drawing/derivation/e3" font-family="Noto Sans CJK SC" font-size="26" font-weight="700" fill="#202A35" text-anchor="start"><tspan x="48" y="254.32">再对 4 个站点差值等权平均</tspan></text><text data-object-id="methods-whiteboard-2/drawing/derivation/e4" font-family="Noto Sans CJK SC" font-size="34" font-weight="400" fill="#202A35" text-anchor="start"><tspan x="48" y="308.76">平均差值 = Σd(s) / 4</tspan></text><text data-object-id="methods-whiteboard-2/drawing/derivation/e5" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#202A35" text-anchor="start"><tspan x="48" y="365.84">95% t 区间：</tspan><tspan x="48" y="400.55999999999995">平均差值 ± 3.182 × SD(d) / 2</tspan></text><text data-object-id="methods-whiteboard-2/drawing/derivation/e6" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#526170" text-anchor="start"><tspan x="48" y="452.56">s 表示站点；仅有 4 个站点。</tspan><tspan x="48" y="482.32">本例无法验证独立性与分布假设。</tspan></text><g data-object-id="methods-whiteboard-2/data-table" role="table" aria-label="Δ = 方法 − 基线，单位 t/ha；每格来自同站 6 个观测"><rect x="710" y="124.79999999999998" width="522" height="50.6" fill="#FFFFFF"/><text data-cell="0:0" font-family="Noto Sans CJK SC" font-size="30" font-weight="700" fill="#252A30"><tspan x="720" y="160.59999999999997">站点</tspan></text><text data-cell="0:1" font-family="Noto Sans CJK SC" font-size="30" font-weight="700" fill="#252A30"><tspan x="837.8709677419355" y="160.59999999999997">随机 Δ</tspan></text><text data-cell="0:2" font-family="Noto Sans CJK SC" font-size="30" font-weight="700" fill="#252A30"><tspan x="1039.9354838709678" y="160.59999999999997">留站 Δ</tspan></text><line x1="710" y1="175.39999999999998" x2="1232" y2="175.39999999999998" stroke="#252A30" stroke-width="1.3"/><rect x="710" y="175.39999999999998" width="522" height="50.6" fill="#FFFFFF"/><text data-cell="1:0" font-family="Noto Sans CJK SC" font-size="30" font-weight="400" fill="#252A30"><tspan x="720" y="211.2">A</tspan></text><text data-cell="1:1" font-family="Noto Sans CJK SC" font-size="30" font-weight="400" fill="#252A30"><tspan x="837.8709677419355" y="211.2">−0.30