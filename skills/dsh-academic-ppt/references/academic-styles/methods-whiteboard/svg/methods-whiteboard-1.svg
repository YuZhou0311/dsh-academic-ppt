24" font-weight="400" fill="#526170" text-anchor="middle"><tspan x="725.5" y="579.04">−0.4</tspan></text><line data-object-id="methods-whiteboard-1/drawing/estimated-effect/e18/segment-1" x1="864.5" y1="543" x2="864.5" y2="549" stroke="#526170" stroke-width="1.5"/><text data-object-id="methods-whiteboard-1/drawing/estimated-effect/e19" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#526170" text-anchor="middle"><tspan x="864.5" y="579.04">−0.2</tspan></text><line data-object-id="methods-whiteboard-1/drawing/estimated-effect/e20/segment-1" x1="1003.5" y1="543" x2="1003.5" y2="549" stroke="#526170" stroke-width="1.5"/><text data-object-id="methods-whiteboard-1/drawing/estimated-effect/e21" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#526170" text-anchor="middle"><tspan x="1003.5" y="579.04">0</tspan></text><line data-object-id="methods-whiteboard-1/drawing/estimated-effect/e22/segment-1" x1="1142.5" y1="543" x2="1142.5" y2="549" stroke="#526170" stroke-width="1.5"/><text data-object-id="methods-whiteboard-1/drawing/estimated-effect/e23" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#526170" text-anchor="middle"><tspan x="1142.5" y="579.04">0.2</tspan></text></svg>