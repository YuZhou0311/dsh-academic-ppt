<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="随机划分误差较低，跨站点差异不确定"><title>随机划分误差较低，跨站点差异不确定</title><defs></defs><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><text data-object-id="methods-whiteboard-1/page-number" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#59616A" text-anchor="end"><tspan x="1232" y="703.28">01 / 02</tspan></text><text data-object-id="methods-whiteboard-1/title" font-family="Noto Serif CJK SC" font-size="40" font-weight="700" fill="#252A30" text-anchor="start"><tspan x="48" y="58.4">随机划分误差较低，跨站点差异不确定</tspan></text><text data-object-id="methods-whiteboard-1/kicker" font-family="Noto Serif CJK SC" font-size="28" font-weight="400" fill="#59616A" text-anchor="start"><tspan x="48" y="98.07999999999998">教学构造数据，非真实科研结果</tspan></text><text data-object-id="methods-whiteboard-1/drawing/study-qualification/e1" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#526170" text-anchor="start"><tspan x="48" y="631.28">共 24 个构造观测，聚合为 4 个站点差值；95% t 区间以站点为统计单位</tspan></text><text data-object-id="methods-whiteboard-1/drawing/study-qualification/e2" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#526170" text-anchor="start"><tspan x="48" y="659.28">仅演示统计与排版；未训练模型，不能推断真实跨站点泛化</tspan></text><text data-object-id="methods-whiteboard-1/drawing/definition/e1" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#202A35" text-anchor="start"><tspan x="48" y="151.67999999999998">比较量</tspan></text><text data-object-id="methods-whiteboard-1/drawing/definition/e2" font-family="Noto Sans CJK SC" font-size="32" font-weight="400" fill="#202A35" text-anchor="start"><tspan x="48" y="207.79999999999998">d(s) = MAE方法(s)</tspan><tspan x="48" y="247.48">       − MAE基线(s)</tspan></text><text data-object-id="methods-whiteboard-1/drawing/definition/e3" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#202A35" text-anchor="start"><tspan x="48" y="311.6">d(s) &lt; 0：方法误差更低</tspan></text><text data-object-id="methods-whiteboard-1/drawing/definition/e4" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#202A35" text-anchor="start"><tspan x="48" y="366.88">d(s) &gt; 0：基线误差更低</tspan></text><text data-object-id="methods-whiteboard-1/drawing/definition/e5" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#202A35" text-anchor="start"><tspan x="48" y="432.15999999999997">点表示站点差值的均值；线表示 </tspan><tspan x="48" y="466.88">95% t 区间。</tspan></text><text data-object-id="methods-whiteboard-1/drawing/estimated-effect/e1" font-family="Noto Sans CJK SC" font-size="26" font-weight="700" fill="#202A35" text-anchor="start"><tspan x="538" y="149.76">ΔMAE = 方法 − 基线（t/ha）</tspan></text><line data-object-id="methods-whiteboard-1/drawing/estimated-effect/e2/segment-1" x1="1003.5" y1="178.79999999999998" x2="1003.5" y2="543" stroke="#526170" stroke-width="1.5" stroke-dasharray="7 5"/><text data-object-id="methods-whiteboard-1/drawing/estimated-effect/e3" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#202A35" text-anchor="start"><tspan x="538" y="215.83999999999997">随机划分</tspan></text><line data-object-id="methods-whiteboard-1/drawing/estimated-effect/e4/segment-1" x1="749.8518178390195" y1="208.79999999999998" x2="840.1481821609805" y2="208.79999999999998" stroke="#245E86" stroke-width="3"/><line data-object-id="methods-whiteboard-1/drawing/estimated-effect/e5/segment-1" x1="749.8518178390195" y1="201.79999999999998" x2="749.8518178390195" y2="215.79999999999998" stroke="#245E86" stroke-width="2"/><line data-object-id="methods-whiteboard-1/drawing/estimated-effect/e6/segment-1" x1="840.1481821609805" y1="201.79999999999998" x2="840.1481821609805" y2="215.79999999999998" stroke="#245E86" stroke-width="2"/><ellipse data-object-id="methods-whiteboard-1/drawing/estimated-effect/e7" cx="795" cy="208.