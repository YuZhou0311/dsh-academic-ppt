e="28" font-weight="400" fill="#202A35" text-anchor="start"><tspan x="678" y="254.95999999999998">同一协议内，方法与基线比较同一组观测。</tspan></text><text data-object-id="thesis-defense-2/drawing/defense-conditions/e3" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#202A35" text-anchor="start"><tspan x="678" y="310.24">先按站点聚合，再计算四个配对差值。</tspan></text><text data-object-id="thesis-defense-2/drawing/defense-conditions/e4" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#202A35" text-anchor="start"><tspan x="678" y="365.52">区间依赖站点独立性与差值分布假设。</tspan></text><text data-object-id="thesis-defense-2/drawing/scope-answer/e1" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#202A35" text-anchor="start"><tspan x="48" y="568.88">外推范围：本例没有真实训练与测试，结论只描述这套构造数值。</tspan></text></svg>