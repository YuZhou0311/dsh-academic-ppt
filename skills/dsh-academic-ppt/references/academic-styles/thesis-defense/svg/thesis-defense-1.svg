<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="随机划分误差较低，跨站点差异不确定"><title>随机划分误差较低，跨站点差异不确定</title><defs></defs><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><text data-object-id="thesis-defense-1/page-number" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#526170" text-anchor="end"><tspan x="1232" y="703.28">01 / 02</tspan></text><text data-object-id="thesis-defense-1/section-label" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#254B6E" text-anchor="start"><tspan x="48" y="40.879999999999995">02  评价结果</tspan></text><text data-object-id="thesis-defense-1/title" font-family="Noto Sans CJK SC" font-size="40" font-weight="700" fill="#202A35" text-anchor="start"><tspan x="48" y="96.4">随机划分误差较低，跨站点差异不确定</tspan></text><text data-object-id="thesis-defense-1/kicker" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#526170" text-anchor="start"><tspan x="48" y="136.07999999999998">教学构造数据，非真实科研结果</tspan></text><line data-object-id="thesis-defense-1/header-rule" x1="48" y1="152.79999999999998" x2="1232" y2="152.79999999999998" stroke="#BAC6D2" stroke-width="1"/><line data-object-id="thesis-defense-1/header-accent" x1="48" y1="152.79999999999998" x2="172" y2="152.79999999999998" stroke="#254B6E" stroke-width="1.6"/><text data-object-id="thesis-defense-1/drawing/study-qualification/e1" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#526170" text-anchor="start"><tspan x="48" y="631.28">共 24 个构造观测，聚合为 4 个站点差值；95% t 区间以站点为统计单位</tspan></text><text data-object-id="thesis-defense-1/drawing/study-qualification/e2" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#526170" text-anchor="start"><tspan x="48" y="659.28">仅演示统计与排版；未训练模型，不能推断真实跨站点泛化</tspan></text><text data-object-id="thesis-defense-1/drawing/question/e1" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#202A35" text-anchor="start"><tspan x="48" y="195.67999999999998">验证问题：随机划分的误差优势能否延伸到未见站点？</tspan></text><text data-object-id="thesis-defense-1/drawing/effect-comparison/e1" font-family="Noto Sans CJK SC" font-size="26" font-weight="700" fill="#202A35" text-anchor="start"><tspan x="48" y="251.76">ΔMAE = 方法 − 基线（t/ha）</tspan></text><line data-object-id="thesis-defense-1/drawing/effect-comparison/e2/segment-1" x1="830.25" y1="280.79999999999995" x2="830.25" y2="482" stroke="#526170" stroke-width="1.5" stroke-dasharray="7 5"/><text data-object-id="thesis-defense-1/drawing/effect-comparison/e3" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#202A35" text-anchor="start"><tspan x="48" y="317.84">随机划分</tspan></text><line data-object-id="thesis-defense-1/drawing/effect-comparison/e4/segment-1" x1="365.8366017268379" y1="310.79999999999995" x2="531.1633982731621" y2="310.79999999999995" stroke="#245E86" stroke-width="3"/><line data-object-id="thesis-defense-1/drawing/effect-comparison/e5/segment-1" x1="365.8366017268379" y1="303.79999999999995" x2="365.8366017268379" y2="317.79999999999995" stroke="#245E86" stroke-width="2"/><line data-object-id="thesis-defense-1/drawing/effect-comparison/e6/segment-1" x1="531.1633982731621" y1="303.79999999999995" x2="531.1633982731621" y2="317.79999999999995" stroke="#245E86" stroke-width="2"/><ellipse data-object-id="thesis-defense-1/drawing/effect-comparison/e7" cx="448.5" cy="310.79999999999995" rx="6" ry="6" fill="#245E86" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text data-object-id="thesis-defense-1/drawing/effect-comparison/e8" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#245E86" text-anchor="start"><tspan x="194" y="351.84">−0.300 [−0.365, −0.235]</tspan></text><text data-object-id="thesis-defense-1/drawing/effect-comparison/e9" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#202A35" text-anchor="start"><tspa