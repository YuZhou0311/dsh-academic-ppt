<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="随机划分误差较低，跨站点差异不确定"><title>随机划分误差较低，跨站点差异不确定</title><defs></defs><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><text data-object-id="field-report-1/page-number" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#55645B" text-anchor="end"><tspan x="1232" y="703.28">01 / 02</tspan></text><text data-object-id="field-report-1/section-label" font-family="Noto Sans CJK SC" font-size="26" font-weight="700" fill="#315A4B" text-anchor="start"><tspan x="48" y="38.96">02  评价结果</tspan></text><text data-object-id="field-report-1/title" font-family="Noto Serif CJK SC" font-size="40" font-weight="700" fill="#26312C" text-anchor="start"><tspan x="48" y="96.4">随机划分误差较低，跨站点差异不确定</tspan></text><text data-object-id="field-report-1/kicker" font-family="Noto Serif CJK SC" font-size="28" font-weight="400" fill="#55645B" text-anchor="start"><tspan x="48" y="136.07999999999998">教学构造数据，非真实科研结果</tspan></text><text data-object-id="field-report-1/drawing/study-qualification/e1" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#526170" text-anchor="start"><tspan x="48" y="631.28">共 24 个构造观测，聚合为 4 个站点差值；95% t 区间以站点为统计单位</tspan></text><text data-object-id="field-report-1/drawing/study-qualification/e2" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" fill="#526170" text-anchor="start"><tspan x="48" y="659.28">仅演示统计与排版；未训练模型，不能推断真实跨站点泛化</tspan></text><text data-object-id="field-report-1/drawing/site-effects/e1" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#202A35" text-anchor="start"><tspan x="48" y="189.67999999999998">每个站点都保留一对差值</tspan></text><line data-object-id="field-report-1/drawing/site-effects/e2/segment-1" x1="565.1428571428571" y1="213.79999999999998" x2="565.1428571428571" y2="534" stroke="#526170" stroke-width="1.5" stroke-dasharray="7 5"/><