 CJK SC" font-size="28" font-weight="700" fill="#245E86" text-anchor="start"><tspan x="878" y="291.2">随机划分</tspan></text><text data-object-id="field-report-1/drawing/site-legend-and-mean/e4" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#202A35" text-anchor="start"><tspan x="878" y="338.48">−0.300 [−0.365, −0.235]</tspan></text><text data-object-id="field-report-1/drawing/site-legend-and-mean/e5" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#A35332" text-anchor="start"><tspan x="878" y="395.76">整站留出</tspan></text><text data-object-id="field-report-1/drawing/site-legend-and-mean/e6" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#202A35" text-anchor="start"><tspan x="878" y="443.03999999999996">0.050 [−0.109, 0.209]</tspan></text><text data-object-id="field-report-1/drawing/site-legend-and-mean/e7" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#202A35" text-anchor="start"><tspan x="878" y="496.47999999999996">左图每点为一个站点差值；右侧</tspan><tspan x="878" y="526.24">为均值与 95% t 区间。</tspan></text></svg>