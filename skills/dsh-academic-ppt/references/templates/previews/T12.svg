 x="866" y="167.04">符号与单位</tspan></text><text data-object-id="T12/card/region-4/body" data-card-id="region-4" font-family="Noto Sans CJK SC" font-size="23" font-weight="400" fill="#1C2430" text-anchor="start"><tspan x="866" y="210.07999999999998">统一状态、动作、参数与损失符号</tspan><tspan x="866" y="238.6">所有数值项保留量纲与归一化</tspan><tspan x="866" y="267.12">避免同一符号代表不同物理量</tspan></text><rect data-object-id="T12/card/region-5/frame" data-card-id="region-5" x="850" y="414" width="382" height="222" rx="0" fill="#FFFFFF" fill-opacity="1" stroke="#BEC8D4" stroke-opacity="1" stroke-width="1.1"/><rect data-object-id="T12/card/region-5/tab" data-card-id="region-5" x="862" y="402" width="172" height="33.6" rx="0" fill="#355D88" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text data-object-id="T12/card/region-5/title" data-card-id="region-5" font-family="Noto Sans CJK SC" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="873" y="428.04">可识别性假设</tspan></text><text data-object-id="T12/card/region-5/body" data-card-id="region-5" font-family="Noto Sans CJK SC" font-size="23" font-weight="400" fill="#1C2430" text-anchor="start"><tspan x="864" y="472.68">解释哪些参数能由观测识别</tspan><tspan x="864" y="501.2">列出需要固定或外部提供的条件</tspan><tspan x="864" y="529.72">用消融或敏感性分析检查解释</tspan></text><text data-object-id="T12/sources" font-family="Noto Sans CJK SC" font-size="15" font-weight="400" fill="#515B68" text-anchor="start"><tspan x="48" y="674.4">T1 · 2026 · 待替换</tspan></text></svg>