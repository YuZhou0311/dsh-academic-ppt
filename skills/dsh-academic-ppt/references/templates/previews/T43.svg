 font-size="26" font-weight="700" fill="#6C528E" text-anchor="start"><tspan x="68" y="386.72999999999996">研究假设</tspan></text><text data-object-id="T43/card/region-3/body" data-card-id="region-3" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#1C2430" text-anchor="start"><tspan x="68" y="432.81">改变一个明确的机制或接口</tspan><tspan x="68" y="462.57">预期哪个指标发生什么变化</tspan><tspan x="68" y="492.33">哪种观察会使假说不获支持</tspan></text><rect data-object-id="T43/card/region-4/frame" data-card-id="region-4" x="442" y="361.77" width="364" height="269.62" rx="0" fill="#FFFFFF" fill-opacity="1" stroke="#235E96" stroke-opacity="1" stroke-width="1.5"/><rect data-object-id="T43/card/region-4/title-cutout" data-card-id="region-4" x="456" y="345.77" width="114" height="34" rx="0" fill="#FFFFFF" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><line data-object-id="T43/card/region-4/base-rule" data-card-id="region-4" x1="462" y1="615.39" x2="497" y2="615.39" stroke="#235E96" stroke-width="3"/><text data-object-id="T43/card/region-4/title" data-card-id="region-4" font-family="Noto Sans CJK SC" font-size="26" font-weight="700" fill="#235E96" text-anchor="start"><tspan x="462" y="371.72999999999996">实验对照</tspan></text><text data-object-id="T43/card/region-4/body" data-card-id="region-4" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#1C2430" text-anchor="start"><tspan x="462" y="425.81"><tspan>冻结其余信息与工具预算</tspan></tspan><tspan x="462" y="455.57"><tspan>设置基线、干预和必要消融</tspan></tspan><tspan x="462" y="485.33"><tspan>保证</tspan><tspan font-weight="700" fill="#235E96">同一评价</tspan><tspan>和留出条件</tspan></tspan></text><rect data-object-id="T43/card/region-5/frame" data-card-id="region-5" x="836" y="344.77" width="396" height="286.62" rx="0" fill="#FFFFFF" fill-opacity="1" stroke="#BEC8D4" stroke-opacity="1" stroke-width="1"/><rect data-object-id="T43/card/region-5/ledger-accent" data-card-id="region-5" x="836" y="344.77" width="6" height="286.62" rx="0"