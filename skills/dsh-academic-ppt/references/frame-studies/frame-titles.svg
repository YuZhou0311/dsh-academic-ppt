<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="03  阅读入口：覆边题签与侧签"><title>03  阅读入口：覆边题签与侧签</title><defs><filter id="shadow-6672616d652d7469746c6573-4" filterUnits="userSpaceOnUse" x="37.3" y="221.3" width="575.4" height="294.4"><feDropShadow dx="1.2246467991473532e-16" dy="2" stdDeviation="4" flood-color="#17243A" flood-opacity="0.14"/></filter></defs><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><text data-object-id="frame-titles/page-number" font-family="Droid Sans Fallback" font-size="18" font-weight="400" fill="#606A77" text-anchor="end"><tspan x="1232" y="703.28">03 / 04</tspan></text><text data-object-id="frame-titles/title" font-family="Droid Sans Fallback" font-size="38" font-weight="700" fill="#17243A" text-anchor="start"><tspan x="48" y="80.47999999999999">03  阅读入口：覆边题签与侧签</tspan></text><text data-object-id="frame-titles/drawing/frame-titles-content/floating-label" font-family="Droid Sans Fallback" font-size="29" font-weight="700" fill="#003E87" text-anchor="start"><tspan x="48" y="163.84">短题签跨过上边框</tspan></text><text data-object-id="frame-titles/drawing/frame-titles-content/rail-label" font-family="Droid Sans Fallback" font-size="29" font-weight="700" fill="#003E87" text-anchor="start"><tspan x="676" y="163.84">条件名与内容逐行对应</tspan></text><rect data-object-id="frame-titles/drawing/frame-titles-content/floating-frame" x="50" y="234" width="550" height="267" rx="4" fill="#FFFFFF" fill-opacity="1" stroke="#AAB8C9" stroke-opacity="1" stroke-width="1.4" filter="url(#shadow-6672616d652d7469746c6573-4)"/><rect data-object-id="frame-titles/drawing/frame-titles-content/floating-tab-paper" x="72" y="211" width="176" height="42" rx="0" fill="#003E87" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1.4"/><text data-object-id="frame-titles/drawing/frame-titles-content/floating-tab-text" font-family="Droid Sans Fallback" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="86" y="240.88">研究问题</tspan></text><text data-object-id="frame-titles/drawing/frame-titles-content/floating-body" font-family="Droid Sans Fallback" font-size="29" font-weight="400" fill="#17243A" text-anchor="start"><tspan x="74" y="319.84">题签命名当前证据组，</tspan><tspan x="74" y="354.64">正文从题签下方另起，</tspan><tspan x="74" y="389.43999999999994">避免边线穿过文字。</tspan></text><line data-object-id="frame-titles/drawing/frame-titles-content/floating-sep/segment-1" x1="74" y1="428" x2="576" y2="428" stroke="#AAB8C9" stroke-width="1.2"/><text data-object-id="frame-titles/drawing/frame-titles-content/floating-bottom" font-family="Droid Sans Fallback" font-size="26" font-weight="400" fill="#606A77" text-anchor="start"><tspan x="74" y="471.96">较长题名改用开放标题</tspan></text><rect data-object-id="frame-titles/drawing/frame-titles-content/rail-frame" x="678" y="234" width="550" height="267" rx="0" fill="#FFFFFF" fill-opacity="1" stroke="#AAB8C9" stroke-opacity="1" stroke-width="1.4"/><rect data-object-id="frame-titles/drawing/frame-titles-content/rail-paper" x="678" y="234" width="112" height="267" rx="0" fill="#003E87" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1.4"/><text data-object-id="frame-titles/drawing/frame-titles-content/rail-heading" font-family="Droid Sans Fallback" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="734" y="335.8">比较</tspan><tspan x="734" y="371.8">条件</tspan></text><text data-object-id="frame-titles/drawing/frame-titles-content/condition-1" font-family="Droid Sans Fallback" font-size="27" font-weight="700" fill="#003E87" text-anchor="start"><tspan x="814" y="285.92">对象</tspan></text><text data-object-id="frame-titles/drawing/frame-titles-content/condition-1-value" font-family="Droid Sans Fallback" font-size="27" font-weight="400" fill="#17243A" text-anchor="start"><tspan x="932" y="285.92">同一研究范围</tspan></text><line data-object-id="frame-titles/drawing/frame-titles-content/rail-sep-1/segment-1" x1="814" y1="312" x2="1202" y2="312" stroke="#AAB8C9" stroke-width="1.2"/><text data-object-id="frame-titles/drawing/frame-titles-content/condition-2" font-family="Droid Sans Fallback" font-size="27" font-weight="700" fill="#003E87" text-anchor="start"><tspan x="814" y="360.92">窗口</tspan></text><text data-object-id="frame-titles/drawing/frame-titles-content/condition-2-value" font-family="Droid Sans Fallback" font-size="27" font-weight="400" fill="#17243A" text-anchor="start"><tspan x="932" y="360.92">同一观察时段</tspan></text><line data-object-id="frame-titles/drawing/frame-titles-content/rail-sep-2/segment-1" x1="814" y1="387" x2="1202" y2="387" stroke="#AAB8C9" stroke-width="1.2"/><text data-object-id="frame-titles/drawing/frame-titles-content/condition-3" font-family="Droid Sans Fallback" font-size="27" font-weight="700" fill="#003E87" text-anchor="start"><tspan x="814" y="435.92">口径</tspan></text><text data-object-id="frame-titles/drawing/frame-titles-content/condition-3-value" font-family="Droid Sans Fallback" font-size="27" font-weight="400" fill="#17243A" text-anchor="start"><tspan x="932" y="435.92">明确单位与分母</tspan></text><text data-object-id="frame-titles/drawing/frame-titles-content/floating-note" font-family="Droid Sans Fallback" font-size="24" font-weight="400" fill="#606A77" text-anchor="start"><tspan x="48" y="562.04">题签下面的边线被覆盖；文字、题签与外框都是可编</tspan><tspan x="48" y="590.8399999999999">辑对象。</tspan></text><text data-object-id="frame-titles/drawing/frame-titles-content/rail-note" font-family="Droid Sans Fallback" font-size="24" font-weight="400" fill="#606A77" text-anchor="start"><tspan x="676" y="562.04">侧签只放短组名。行高由内容决定，不把长中文逐字</tspan><tspan x="676" y="590.8399999999999">竖排。</tspan></text></svg>
