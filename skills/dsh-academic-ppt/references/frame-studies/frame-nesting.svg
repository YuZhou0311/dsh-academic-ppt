"80" y="229.92">验证方案 · 结构示意</tspan></text><rect data-object-id="frame-nesting/drawing/frame-nesting-content/input" x="76" y="279" width="260" height="147" rx="3" fill="#FFFFFF" fill-opacity="1" stroke="#AAB8C9" stroke-opacity="1" stroke-width="1.4"/><rect data-object-id="frame-nesting/drawing/frame-nesting-content/input-title-paper" x="76" y="279" width="260" height="42" rx="0" fill="#003E87" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1.4"/><text data-object-id="frame-nesting/drawing/frame-nesting-content/input-title-text" font-family="Droid Sans Fallback" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="90" y="308.88">输入与定义</tspan></text><text data-object-id="frame-nesting/drawing/frame-nesting-content/input-body" font-family="Droid Sans Fallback" font-size="26" font-weight="400" fill="#17243A" text-anchor="start"><tspan x="96" y="367.96">研究对象</tspan><tspan x="96" y="399.15999999999997">观测窗口与变量</tspan></text><rect data-object-id="frame-nesting/drawing/frame-nesting-content/output" x="492" y="279" width="260" height="147" rx="3" fill="#FFFFFF" fill-opacity="1" stroke="#AAB8C9" stroke-opacity="1" stroke-width="1.4"/><rect data-object-id="frame-nesting/drawing/frame-nesting-content/output-title-paper" x="492" y="279" width="260" height="42" rx="0" fill="#003E87" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1.4"/><text data-object-id="frame-nesting/drawing/frame-nesting-content/output-title-text" font-family="Droid Sans Fallback" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="506" y="308.88">独立评价</tspan></text><text data-object-id="frame-nesting/drawing/frame-nesting-content/output-body" font-family="Droid Sans Fallback" font-size="26" font-weight="400" fill="#17243A" text-anchor="start"><tspan x="512" y="367.96">评价指标</tspan><tspan x="512" y="399.15999999999997">单位与比较口径</tspan></text><line data-object-id="frame-nesting/drawing/frame-nesting-content/method-link/segment-1" x1="356" y1="353" x2="471" y2="353" stroke="#003E87" stroke-width="2" marker-end="url(#arrow-6672616d652d6e657374696e67-15)"/><text data-object-id="frame-nesting/drawing/frame-nesting-content/outer-condition" font-family="Droid Sans Fallback" font-size="26" font-weight="400" fill="#606A77" text-anchor="start"><tspan x="76" y="480.96">外层定义范围，内部说明任务与连接</tspan></text><line data-object-id="frame-nesting/drawing/frame-nesting-content/open-top/segment-1" x1="842" y1="222" x2="1228" y2="222" stroke="#003E87" stroke-width="1.8"/><text data-object-id="frame-nesting/drawing/frame-nesting-content/open-title" font-family="Droid Sans Fallback" font-size="29" font-weight="700" fill="#003E87" text-anchor="start"><tspan x="842" y="275.84">读图时先看什么</tspan></text><text data-object-id="frame-nesting/drawing/frame-nesting-content/open-body" font-family="Droid Sans Fallback" font-size="27" font-weight="400" fill="#17243A" text-anchor="start"><tspan x="842" y="346.92">让解释靠近对应的图。</tspan><tspan x="842" y="379.32">用基线、间距和字重组织，</tspan><tspan x="842" y="411.72">无需每段都补完整边框。</tspan></text><line data-object-id="frame-nesting/drawing/frame-nesting-content/open-bottom/segment-1" x1="842" y1="478" x2="1228" y2="478" stroke="#003E87" stroke-width="1.8"/><text data-object-id="frame-nesting/drawing/frame-nesting-content/nesting-note" font-family="Droid Sans Fallback" font-size="24" font-weight="400" fill="#606A77" text-anchor="start"><tspan x="48" y="571.04">只有新增真实包含关系才多加一层。外层不加阴影，内部同级模块采</tspan><tspan x="48" y="599.8399999999999">用同一语言。</tspan></text><text data-object-id="frame-nesting/drawing/frame-nesting-content/open-note" font-family="Droid Sans Fallback" font-size="24" font-weight="400" fill="#606A77" text-anchor="start"><tspan x="840" y="571.04">开放结构仍有清楚入口和归属，不等</tspan><tspan x="840" y="599.8399999999999">于随意散落文字。</tspan></text></svg>
