<section class="slide" data-index="1" aria-label="第 2 页"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="02  纸面层次：细实线与无边线阴影"><title>02  纸面层次：细实线与无边线阴影</title><defs><filter id="shadow-6672616d652d6465707468-6" filterUnits="userSpaceOnUse" x="51.3" y="207.3" width="549.4" height="291.4"><feDropShadow dx="1.2246467991473532e-16" dy="2" stdDeviation="4" flood-color="#17243A" flood-opacity="0.14"/></filter><filter id="shadow-6672616d652d6465707468-7" filterUnits="userSpaceOnUse" x="679.3" y="207.3" width="549.4" height="291.4"><feDropShadow dx="1.2246467991473532e-16" dy="2" stdDeviation="4" flood-color="#17243A" flood-opacity="0.14"/></filter></defs><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><text data-object-id="frame-depth/page-number" font-family="Droid Sans Fallback" font-size="18" font-weight="400" fill="#606A77" text-anchor="end"><tspan x="1232" y="703.28">02 / 04</tspan></text><text data-object-id="frame-depth/title" font-family="Droid Sans Fallback" font-size="38" font-weight="700" fill="#17243A" text-anchor="start"><tspan x="48" y="80.47999999999999">02  纸面层次：细实线与无边线阴影</tspan></text><text data-object-id="frame-depth/drawing/frame-depth-content/outline-label" font-family="Droid Sans Fallback" font-size="29" font-weight="700" fill="#003E87" text-anchor="start"><tspan x="48" y="163.84">白底、细实线、轻阴影</tspan></text><text data-object-id="frame-depth/drawing/frame-depth-content/paper-label" font-family="Droid Sans Fallback" font-size="29" font-weight="700" fill="#003E87" text-anchor="start"><tspan x="676" y="163.84">白底、无可见边线、轻阴影</tspan></text><rect data-object-id="frame-depth/drawing/frame-depth-content/backdrop-left" x="48" y="204" width="556" height="304" rx="0" fill="#F3F5F8" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1.4"/><rect data-object-id="frame-depth/drawing/frame-depth-content/backdrop-right" x="676" y="204" width="55 me-depth-content/shadow-tail" font-family="Droid Sans Fallback" font-size="24" font-weight="400" fill="#606A77" text-anchor="start"><tspan x="716" y="452.04">不要给每一层都加阴影</tspan></text><text data-object-id="frame-depth/drawing/frame-depth-content/outline-note" font-family="Droid Sans Fallback" font-size="24" font-weight="400" fill="#606A77" text-anchor="start"><tspan x="48" y="562.04">灰蓝 1.2px 边线，阴影 opacity 0.14、blur 4</tspan><tspan x="48" y="590.8399999999999">px、offset 2px。</tspan></text><text data-object-id="frame-depth/drawing/frame-depth-content/shadow-note" font-family="Droid Sans Fallback" font-size="24" font-weight="400" fill="#606A77" text-anchor="start"><tspan x="676" y="562.04">同一阴影参数；stroke:none。组间留白防止阴影</tspan><tspan x="676" y="590.8399999999999">连成脏边。</tspan></text></svg></section>

  const pages=[{"title":"01  范围边界：实线与无填充虚线","notes":"原创组件视觉教学页。页面文字描述设计用途，不包含研究数据、论文结论或用户模板资产。\n两个完整边界采用相同语义层级。右侧真正 noFill；标题用独立白色对象打断上边线，无阴影。","seconds":0},{"title":"02  纸面层次：细实线与无边线阴影","notes":"原创组件视觉教学页。页面文字描述设计用途，不包含研究数据、论文结论或用户模板资产。\n两个白色纸面有相同大小与轻阴影，左侧额外细线，右侧无可见边线。浅灰背景只用于清楚演示纸面差异。","seconds":0},{"title":"03  阅读入口：覆边题签与侧签","notes":"原创组件视觉教学页。页面文字描述设计用途，不包含研究数据、论文结论或用户模板资产。\n浮签使用独立深蓝底与白字，覆盖上边线；侧签明确命名共享条件，内部按行对齐。","seconds":0},{"title":"04  外层范围、内部模块与开放注释","notes":"原创组件视觉教学页。页面文字描述设计用途，不包含研究数据、论文结论或用户模板资产。\n外层透明虚线，内部白底实线和深蓝标题带；独立开放注释说明不同职责可以使用不同边界。图中箭头仅展示版式结构，不代表任何研究结果。","seconds":0}];let index=0;const frames=[...document.querySelectorAll('.slide')],notes=document.getElementById('notes');
  function go(i){index=Math.max(0,Math.min(frames.length-1,i));frames.forEach((f,j)=>f.classList.toggle('active',j===index));document.getElementById('counter').textContent=(index+1)+' / '+frames.length;notes.textContent=pages[index].title+'\n\n'+(pages[index].notes||'本页没有讲稿备注。');history.replaceState(null,'','#slide-'+(index+1))}
