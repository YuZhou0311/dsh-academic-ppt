<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="01  范围边界：实线与无填充虚线"><title>01  范围边界：实线与无填充虚线</title><defs></defs><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><text data-object-id="frame-boundaries/page-number" font-family="Droid Sans Fallback" font-size="18" font-weight="400" fill="#606A77" text-anchor="end"><tspan x="1232" y="703.28">01 / 04</tspan></text><text data-object-id="frame-boundaries/title" font-family="Droid Sans Fallback" font-size="38" font-weight="700" fill="#17243A" text-anchor="start"><tspan x="48" y="80.47999999999999">01  范围边界：实线与无填充虚线</tspan></text><text data-object-id="frame-boundaries/drawing/frame-boundaries-content/solid-label" font-family="Droid Sans Fallback" font-size="29" font-weight="700" fill="#003E87" text-anchor="start"><tspan x="48" y="163.84">同一实验的完整证据组</tspan></text><text data-object-id="frame-boundaries/drawing/frame-boundaries-content/dash-label" font-family="Droid Sans Fallback" font-size="29" font-weight="700" fill="#003E87" text-anchor="start"><tspan x="676" y="163.84">多子图的共同评价范围</tspan></text><rect data-object-id="frame-boundaries/drawing/frame-boundaries-content/solid-frame" x="50" y="217" width="550" height="281" rx="5" fill="none" fill-opacity="1" stroke="#023160" stroke-opacity="1" stroke-width="1.4"/><rect data-object-id="frame-boundaries/drawing/frame-boundaries-content/solid-title-paper" x="72" y="199" width="148" height="38" rx="0" fill="#FFFFFF" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1.4"/><text data-object-id="frame-boundaries/drawing/frame-boundaries-content/solid-title-text" font-family="Droid Sans Fallback" font-size="27" font-weight="700" fill="#023160" text-anchor="start"><tspan x="82" y="227.92">实验条件</tspan></text><text data-object-id="frame-boundaries/drawing/frame-boundaries-content/solid-body" font-family="Droid Sans Fallback" font-size="28" font-weight="400" fill="#17243A" text-anchor="start"><tspan x="72" y="286.88">边界标出共同归属。</tspan><tspan x="72" y="320.48">内部文字、图例与来源各自对齐，</tspan><tspan x="72" y="354.08">不把每一句话都单独套框。</tspan></text><line data-object-id="frame-boundaries/drawing/frame-boundaries-content/solid-sep/segment-1" x1="72" y1="403" x2="578" y2="403" stroke="#AAB8C9" stroke-width="1.2"/><text data-object-id="frame-boundaries/drawing/frame-boundaries-content/solid-tail" font-family="Droid Sans Fallback" font-size="27" font-weight="700" fill="#003E87" text-anchor="start"><tspan x="72" y="447.92">完整原图与解释保持相邻</tspan></text><rect data-object-id="frame-boundaries/drawing/frame-boundaries-content/dash-frame" x="678" y="217" width="550" height="281" rx="5" fill="none" fill-opacity="1" stroke="#023160" stroke-opacity="1" stroke-width="1.8" stroke-dasharray="7 5"/><rect data-object-id="frame-boundaries/drawing/frame-boundaries-content/dash-title-paper" x="698" y="199" width="204" height="38" rx="0" fill="#FFFFFF" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1.4"/><text data-object-id="frame-boundaries/drawing/frame-boundaries-content/dash-title-text" font-family="Droid Sans Fallback" font-size="27" font-weight="700" fill="#023160" text-anchor="start"><tspan x="708" y="227.92">共同评价范围</tspan></text><text data-object-id="frame-boundaries/drawing/frame-boundaries-content/a-label" font-family="Droid Sans Fallback" font-size="28" font-weight="700" fill="#003E87" text-anchor="start"><tspan x="700" y="288.88">条件 A</tspan></text><text data-object-id="frame-boundaries/drawing/frame-boundaries-content/b-label" font-family="Droid Sans Fallback" font-size="28" font-weight="700" fill="#003E87" text-anchor="start"><tspan x="982" y="288.88">条件 B</tspan></text><text data-object-id="frame-boundaries/drawing/frame-boundaries-content/a-body" font-family="Droid Sans Fallback" font-size="26" font-weight="400" fill="#17243A" text-anchor="start"><tspan x="700" y="344.96">同一观测窗口</tspan><tspan x="700" y="376.15999999999997">完整的变量定义</tspan></text><text data-object-id="frame-boundaries/drawing/frame-boundaries-content/b-body" font-family="Droid Sans Fallback" font-size="26" font-weight="400" fill="#17243A" text-anchor="start"><tspan x="982" y="344.96">同一评价口径</tspan><tspan x="982" y="376.15999999999997">对应的比较对象</tspan></text><line data-object-id="frame-boundaries/drawing/frame-boundaries-content/pair-divider/segment-1" x1="957" y1="265" x2="957" y2="414" stroke="#AAB8C9" stroke-width="1.2"/><text data-object-id="frame-boundaries/drawing/frame-boundaries-content/dash-tail" font-family="Droid Sans Fallback" font-size="25" font-weight="400" fill="#606A77" text-anchor="start"><tspan x="700" y="460">虚线本身不代表结果尚未验证</tspan></text><text data-object-id="frame-boundaries/drawing/frame-boundaries-content/solid-note" font-family="Droid Sans Fallback" font-size="24" font-weight="400" fill="#606A77" text-anchor="start"><tspan x="48" y="555.04">透明实线框：线重清楚，正文距边界留足空隙。</tspan></text><text data-object-id="frame-boundaries/drawing/frame-boundaries-content/dash-note" font-family="Droid Sans Fallback" font-size="24" font-weight="400" fill="#606A77" text-anchor="start"><tspan x="676" y="555.04">透明虚线框：聚合范围。需要表达方案或假设时，另</tspan><tspan x="676" y="583.8399999999999">写清身份。</tspan></text></svg>
