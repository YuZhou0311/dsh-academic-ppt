<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="02  纸面层次：细实线与无边线阴影"><title>02  纸面层次：细实线与无边线阴影</title><defs><filter id="shadow-6672616d652d6465707468-6" filterUnits="userSpaceOnUse" x="51.3" y="207.3" width="549.4" height="291.4"><feDropShadow dx="1.2246467991473532e-16" dy="2" stdDeviation="4" flood-color="#17243A" flood-opacity="0.14"/></filter><filter id="shadow-6672616d652d6465707468-7" filterUnits="userSpaceOnUse" x="679.3" y="207.3" width="549.4" height="291.4"><feDropShadow dx="1.2246467991473532e-16" dy="2" stdDeviation="4" flood-color="#17243A" flood-opacity="0.14"/></filter></defs><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/><text data-object-id="frame-depth/page-number" font-family="Droid Sans Fallback" font-size="18" font-weight="400" fill="#606A77" text-anchor="end"><tspan x="1232" y="703.28">02 / 04</tspan></text><text data-object-id="frame-depth/title" font-family="Droid Sans Fallback" font-size="38" font-weight="700" fill="#17243A" text-anchor="start"><tspan x="48" y="80.47999999999999">02  纸面层次：细实线与无边线阴影</tspan></text><text data-object-id="frame-depth/drawing/frame-depth-content/outline-label" font-family="Droid Sans Fallback" font-size="29" font-weight="700" fill="#003E87" text-anchor="start"><tspan x="48" y="163.84">白底、细实线、轻阴影</tspan></text><text data-object-id="frame-depth/drawing/frame-depth-content/paper-label" font-family="Droid Sans Fallback" font-size="29" font-weight="700" fill="#003E87" text-anchor="start"><tspan x="676" y="163.84">白底、无可见边线、轻阴影</tspan></text><rect data-object-id="frame-depth/drawing/frame-depth-content/backdrop-left" x="48" y="204" width="556" height="304" rx="0" fill="#F3F5F8" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1.4"/><rect data-object-id="frame-depth/drawing/frame-depth-content/backdrop-right" x="676" y="204" width="556" height="304" rx="0" fill="#F3F5F8" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1.4"/><rect data-object-id="frame-depth/drawing/frame-depth-content/outline-paper" x="64" y="220" width="524" height="264" rx="4" fill="#FFFFFF" fill-opacity="1" stroke="#AAB8C9" stroke-opacity="1" stroke-width="1.4" filter="url(#shadow-6672616d652d6465707468-6)"/><rect data-object-id="frame-depth/drawing/frame-depth-content/shadow-paper" x="692" y="220" width="524" height="264" rx="1" fill="#FFFFFF" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1.4" filter="url(#shadow-6672616d652d6465707468-7)"/><text data-object-id="frame-depth/drawing/frame-depth-content/outline-heading" font-family="Droid Sans Fallback" font-size="31" font-weight="700" fill="#003E87" text-anchor="start"><tspan x="88" y="273.76">证据面板</tspan></text><text data-object-id="frame-depth/drawing/frame-depth-content/outline-body" font-family="Droid Sans Fallback" font-size="27" font-weight="400" fill="#17243A" text-anchor="start"><tspan x="88" y="334.92">原图、图例与解释属于同一证据组。</tspan><tspan x="88" y="367.32">白色纸面承托内容，细线限定范围，</tspan><tspan x="88" y="399.72">轻阴影使它与背景略有分离。</tspan></text><text data-object-id="frame-depth/drawing/frame-depth-content/outline-tail" font-family="Droid Sans Fallback" font-size="24" font-weight="400" fill="#606A77" text-anchor="start"><tspan x="88" y="452.04">阴影不表示证据更可靠</tspan></text><text data-object-id="frame-depth/drawing/frame-depth-content/shadow-heading" font-family="Droid Sans Fallback" font-size="31" font-weight="700" fill="#003E87" text-anchor="start"><tspan x="716" y="273.76">图旁说明</tspan></text><text data-object-id="frame-depth/drawing/frame-depth-content/shadow-body" font-family="Droid Sans Fallback" font-size="27" font-weight="400" fill="#17243A" text-anchor="start"><tspan x="716" y="334.92">说明放在所解释的图旁。</tspan><tspan x="716" y="367.32">省去可见边线，保留纸面层次。</tspan><tspan x="716" y="399.72">关键条件仍用可读的正文表达。</tspan></text><text data-object-id="frame-depth/drawing/frame-depth-content/shadow-tail" font-family="Droid Sans Fallback" font-size="24" font-weight="400" fill="#606A77" text-anchor="start"><tspan x="716" y="452.04">不要给每一层都加阴影</tspan></text><text data-object-id="frame-depth/drawing/frame-depth-content/outline-note" font-family="Droid Sans Fallback" font-size="24" font-weight="400" fill="#606A77" text-anchor="start"><tspan x="48" y="562.04">灰蓝 1.2px 边线，阴影 opacity 0.14、blur 4</tspan><tspan x="48" y="590.8399999999999">px、offset 2px。</tspan></text><text data-object-id="frame-depth/drawing/frame-depth-content/shadow-note" font-family="Droid Sans Fallback" font-size="24" font-weight="400" fill="#606A77" text-anchor="start"><tspan x="676" y="562.04">同一阴影参数；stroke:none。组间留白防止阴影</tspan><tspan x="676" y="590.8399999999999">连成脏边。</tspan></text></svg>
