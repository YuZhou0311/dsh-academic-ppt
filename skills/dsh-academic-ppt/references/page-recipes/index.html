  const pages=[{"title":"01  现象、证据与可检验问题","notes":"适用：开场需要把实际现象收束为一个能被研究回答的问题。\n\n避免：已经进入结果精读，或现象图只起装饰作用。\n\n证据需要：可定位的现象或需求证据；明确尚未回答的关系。\n\n构图关系：现象建立入口，证据解释为何重要，问题连接下一页的检验。\n\n候选替代：research-gap, hero-evidence\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"02  单一证据精读","notes":"适用：一幅复杂图需要完整画幅读清轴、图例与关系。\n\n避免：没有单一共同问题，却把无关拼图塞满整页。\n\n证据需要：原图、定位、完整轴和单位；解释在图中邻接或进入讲稿。\n\n构图关系：阅读入口由证据本身决定，内部多面板仍需实际阅读顺序。\n\n候选替代：evidence-margin, small-multiples\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"03  主证据与开放旁注","notes":"适用：一幅可读主图只需要短的解释与适用边界。\n\n避免：旁注很长，或窄栏使主图的关键标签不可读。\n\n证据需要：主图来源；旁注须区分观察、推断和边界。\n\n构图关系：证据占主要画幅，侧栏就近解释局部，不复述整页标题。\n\n候选替代：hero-evidence, evidence-ledger\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"04  主图、解释与边界分层","notes":"适用：同一证据需要明确分开结果解释与适用边界。\n\n避免：两个辅助区都只写同义结论。\n\n证据需要：一幅证据，得到该解释的依据，至少一个真实限制条件。\n\n构图关系：大证据跨两层；上部解释，下部条件，避免相同大小三卡。\n\n候选替代：evidence-margin, mechanism-proof\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"05  共尺度对照","notes":"适用：两个处理、方法或状态在同一评价口径下直接比较。\n\n避免：两组研究的样本、指标或尺度不可比且未披露。\n\n证据需要：A/B 的同一尺度、基准、分母、评价窗口和独立样本定义。\n\n构图关系：两个证据在相同高度与尺度对齐，共享比较条件只写一次。\n\n候选替代：before-after-delta, literature-matrix\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"06  前后状态与差异解释","notes":"适用：同一对象的两个时间点或干预前后需要同时呈现差异。\n\n避免：不同对象被误写成前后变化，或未排除时间混杂。\n\n证据需要：对象配对规则、前后时间、变化的计量方式与混杂限制。\n\n构图关系：上部保留前后证据；下部以差异或变化机制连接，不重复两个描述。\n\n候选替代：paired-comparison, contradiction-explainer\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"07  可比较的多面板","notes":"适用：同一变量在不超过四个明确条件下比较，且能共用尺度。\n\n避免：原论文四个过密面板仍看不清，或各图坐标不相容。\n\n证据需要：各面板的条件、共享或明确不同的尺度、完整图例和来源。\n\n构图关系：行列有明确语义；位置代表条件，不能为凑四格而添结果。\n\n候选替代：paired-comparison, hero-evidence\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"08  总体结果与精确统计","notes":"适用：趋势/分布与少量精确统计值需要同时供观众核对。\n\n避免：数字表仅复述图中全部数值，或不确定性来源未知。\n\n证据需要：结果图、同一分析的统计量、单位、n 和不确定性定义。\n\n构图关系：上部读模式，下部核对数值；统计表不应挤成小角落。\n\n候选替代：distribution-uncertainty, evidence-ledger\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"09  分布与估计不确定性","notes":"适用：需要区分个体观测分布和总体估计区间。\n\n避免：只有均值却编造离散点、箱线图或置信区间。\n\n证据需要：原始观测或已报告分布；已报告或可复算区间；区间的定义。\n\n构图关系：分布与估计分开表达，并共享样本及单位说明。\n\n候选替代：result-statistics, paired-comparison\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"10  总体定位与局部证据","notes":"适用：需要把局部现象放回总体对象、空间或系统。\n\n避免：局部图与总体没有可追踪对应，或裁剪丢掉决定性边界。\n\n证据需要：总体与局部的定位关系、比例尺/坐标、裁剪与放大说明。\n\n构图关系：总览跨两层，两个局部与总览中明确标记的位置对应。\n\n候选替代：hero-evidence, evidence-ledger\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"11  跨尺度关系","notes":"适用：研究把不同尺度的观测、过程或外推联系起来。\n\n避免：仅有三个平行对象却画成上下游或尺度递进。\n\n证据需要：每层的空间/时间支持、测量对象和跨尺度映射假设。\n\n构图关系：一个连续关系图表达尺度转换；辅助栏列出不能直接外推的条件。\n\n候选替代：method-pipeline, source-evidence-map\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"12  来源到论证的映射","notes":"适用：多篇研究为同一个问题提供不同证据角色。\n\n避免：只是将论文封面并排，缺少共同问题或支持关系。\n\n证据需要：每个来源的具体结论、定位和支持/冲突/补充身份。\n\n构图关系：来源列对接论证图；连接线必须能解释支持的具体命题。\n\n候选替代：literature-matrix, cross-study-synthesis\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"13  文献证据矩阵","notes":"适用：跨研究按少数相同维度进行可审查比较。\n\n避免：表中塞下每篇论文的所有摘要，或指标定义不同却直接排名。\n\n证据需要：来源、研究条件、比较维度与不可比项，逐行可追溯。\n\n构图关系：列是比较维度，行是研究或方法；边界与缺测必须显式保留。\n\n候选替代：source-evidence-map, cross-study-synthesis\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"14  已有能力、失效条件与缺口","notes":"适用：需要从已有研究推导一个具体缺口。\n\n避免：用“研究很少”代替证据，或未检索就宣布首次。\n\n证据需要：已有能力的真实证据、失效/未覆盖条件及可检验问题。\n\n构图关系：上部对照能力与边界，下部把缺口写成可操作的关系。\n\n候选替代：question-evidence, proposal-decision\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"15  方法管线与输入输出约束","notes":"适用：方法有清晰的输入、变换、输出以及相应条件。\n\n避免：步骤本身是反馈或并行依赖，却被线性箭头掩盖。\n\n证据需要：真实操作和数据流；每一步的输入输出对象；训练/评估边界。\n\n构图关系：主流程横贯画幅，下方解释输入条件与输出验证，箭头端点真实。\n\n候选替代：method-swimlane, feedback-cycle\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"16  并行方法泳道","notes":"适用：两个主体、数据源或阶段并行执行后汇合。\n\n避免：实际仅是三个相邻标签，或流程顺序/同步关系未知。\n\n证据需要：各泳道主体、共享阶段、交互/汇合点及传递对象。\n\n构图关系：行代表主体、列代表阶段；跨行连线表达数据交换，不做装饰。\n\n候选替代：method-pipeline, factorial-design\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"17  状态更新与反馈回路","notes":"适用：观测或反馈改变系统的下一状态，线性列表会丢失核心机制。\n\n避免：没有实际更新方程或因果方向，却画一个闭环表示完整。\n\n证据需要：预测状态、观测、误差/创新量、更新对象和时间索引。\n\n构图关系：闭环中区分预测、观测与校正，右栏保留状态/参数/单位身份。\n\n候选替代：method-pipeline, equation-interpretation\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"18  实验处理与共同评估","notes":"适用：需要说明样本如何分组、接受处理并进入共同评估。\n\n避免：直接放结果却没有交代随机化、对照或分析单位。\n\n证据需要：实验单位、分配规则、处理、对照、评价指标和重复结构。\n\n构图关系：分支代表处理，汇合代表共同评估；下栏保留公平比较的条件。\n\n候选替代：factorial-design, cohort-flow\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"19  样本流转与排除理由","notes":"适用：样本数量在筛选、随访或清洗中发生变化。\n\n避免：只有总样本量，无法核对各步骤的数量守恒。\n\n证据需要：每一步的样本数量、排除理由、分析集与重复单位。\n\n构图关系：纵向流转与右侧排除/分组对应，不能以流程图掩盖样本变化。\n\n候选替代：experiment-design, result-statistics\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"20  因子、处理组合与分析","notes":"适用：两个或多个因素的处理组合决定实验安排。\n\n避免：观测分组被误写成随机因子设计。\n\n证据需要：因素、水平、重复、随机化/区组方式、交互效应的分析定义。\n\n构图关系：左侧精确组合矩阵，右侧表达分配/分析关系。\n\n候选替代：experiment-design, literature-matrix\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"21  机制与支持证据","notes":"适用：机制示意需要与具体结果相互核对。\n\n避免：示意箭头被当成因果证据，或证据只支持相关性。\n\n证据需要：机制来源、对应观测/干预、替代解释和适用边界。\n\n构图关系：左机制右证据逐点对应，下栏标明证据不能证明什么。\n\n候选替代：evidence-ledger, contradiction-explainer\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"22  公式、符号与成立条件","notes":"适用：核心方程值得逐项解释，并且影响后续方法或判断。\n\n避免：公式仅增加学术感，或渲染不能保留数学符号。\n\n证据需要：公式来源/推导身份、变量与单位、假设、适用域。\n\n构图关系：公式为主视觉；符号解释与假设是不同层，不能只放无定义方程。\n\n候选替代：feedback-cycle, method-pipeline\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"23  消融结果与干预定义","notes":"适用：需要把性能变化与具体移除/替换的组件关联。\n\n避免：多个因素同时变化却把差异归因于单一组件。\n\n证据需要：基线、唯一干预、共同训练/验证条件、方差和指标方向。\n\n构图关系：左侧结果对齐右侧组件/干预表，阅读者能核查每个比较的含义。\n\n候选替代：result-statistics, paired-comparison\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"24  条件变化与稳健性边界","notes":"适用：结论随环境、参数或数据分布变化，需要呈现失效区域。\n\n避免：只有最佳配置的一个数字，却宣称普遍稳健。\n\n证据需要：实际扫描范围、指标尺度、失败条件与未观测区域。\n\n构图关系：上部条件空间保留连续性/离散性，下部解释有效域与失效域。\n\n候选替代：small-multiples, limitation-response\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"25  冲突结果与条件解释","notes":"适用：研究得到方向不同的结果，需要解释条件差异。\n\n避免：通过删去反向结果来制造一致结论。\n\n证据需要：两项结果的真实出处、指标、样本、尺度及可比性。\n\n构图关系：冲突先可见，再比较可能解释；假设性的解释明确为推断。\n\n候选替代：paired-comparison, cross-study-synthesis\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"26  跨研究证据与综合判断","notes":"适用：一组研究已经比较过，需要回答共同问题并保留分歧。\n\n避免：未完成逐项核对就生成包罗万象的共识。\n\n证据需要：比较过的来源、支持/冲突/缺测记录和推断边界。\n\n构图关系：上部证据关系压缩但可追溯，下部明确综合判断与尚未知之处。\n\n候选替代：literature-matrix, source-evidence-map\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"27  局限、影响与可检验响应","notes":"适用：需要把局限具体连接到影响和补救/验证动作。\n\n避免：列出泛泛缺点，然后默认未来工作必然解决。\n\n证据需要：局限的证据、影响哪一项判断、可测的响应与失败分支。\n\n构图关系：每一行是局限→影响→行动的同一关系，行数由实际材料决定。\n\n候选替代：proposal-decision, robustness-landscape\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"28  研究方案与判定分支","notes":"适用：尚未实施的方案需要解释如何得到可判定结果。\n\n避免：将预期效果写成已取得结果，或只画成功路线。\n\n证据需要：明确假设、公平对照、观测指标、预先定义的判断及失败后行动。\n\n构图关系：问题通向实验，再分为支持/不支持两条路径，保留两种结果。\n\n候选替代：experiment-design, research-gap\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"29  研究任务的依赖网络","notes":"适用：多个工作包有真实数据、方法或交付物依赖。\n\n避免：只需并列任务清单却画大量无意义箭头。\n\n证据需要：每个工作包的输入、输出、负责人/边界、依赖与汇合。\n\n构图关系：节点是研究任务，边是可说明的交付物，关键路径不能靠颜色臆断。\n\n候选替代：method-swimlane, milestone-timeline\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"30  里程碑与验收证据","notes":"适用：研究进度必须对应时间和可核验交付物。\n\n避免：时间点没有依据，或把所有任务画成顺序串行。\n\n证据需要：开始/结束或阶段时间、依赖、当前状态与验收定义。\n\n构图关系：上部时间与任务对齐，下部说明关键里程碑如何被验收。\n\n候选替代：work-package-dependency, proposal-decision\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"31  资源结构与精确核对","notes":"适用：需要解释资源如何分配，并核对总量与项目。\n\n避免：缺少真实预算或数量，却用饼图面积暗示精确比例。\n\n证据需要：真实总量、单位、分配规则、分类互斥性与加总校验。\n\n构图关系：结构图解释归属，表格保留精确数值；图表不新增虚构预算。\n\n候选替代：result-statistics, literature-matrix\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30},{"title":"32  以证据回应开场问题","notes":"适用：结尾需要回到开场问题，明确已知、边界和下一步讨论。\n\n避免：最后一页只重复章节标题或喊口号。\n\n证据需要：已讲过的证据链、可支持的回答、不可外推范围。\n\n构图关系：主区域回答问题，下部将关键证据与未决条件并置，不引入新发现。\n\n候选替代：cross-study-synthesis, question-evidence\n\n所有示意图均原创；图形形态用于显示信息关系，不能作为论文图或实际研究结果使用。","seconds":30}];let index=0;const frames=[...document.querySelectorAll('.slide')],notes=document.getElementById('notes');
  function go(i){index=Math.max(0,Math.min(frames.length-1,i));frames.forEach((f,j)=>f.classList.toggle('active',j===index));document.getElementById('counter').textContent=(index+1)+' / '+frames.length;notes.textContent=pages[index].title+'\n\n'+(pages[index].notes||'本页没有讲稿备注。');history.replaceState(null,'','#slide-'+(index+1))}
  document.getElementById('prev').onclick=()=>go(index-1);document.getElementById('next').onclick=()=>go(index+1);document.getElementById('overview').onclick=()=>document.body.classList.toggle('overview');document.getElementById('show-notes').onclick=()=>notes.hidden=!notes.hidden;document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();frames.forEach((f,i)=>f.onclick=()=>{if(document.body.classList.contains('overview')){document.body.classList.remove('overview');go(i)}});document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(index+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(index-1)}if(e.key.toLowerCase()==='g')document.body.classList.toggle('overview');if(e.key.toLowerCase()==='s')notes.hidden=!notes.hidden;if(e.key==='Escape'){notes.hidden=true;document.body.classList.remove('overview')}});go((Number(location.hash.replace('#slide-',''))||1)-1);
  </script></body></html>
