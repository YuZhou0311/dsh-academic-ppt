name: Publish original RC7 release

on:
  push:
    branches: [release/rc7-20261108]
    paths: [.github/workflows/publish-rc7-original.yml]

permissions:
  contents: write

concurrency:
  group: publish-original-rc7
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.10.0-rc.7
      RELEASE_BRANCH: release/rc7-20261108
      BUNDLE_SHA256: c625480f8ab138a6d9d2753a957c11d8d0a9c1a1cf323536c60c57d96c429aca
      BUNDLE_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-a724-81fd-8efd-13f6ddd82307/raw?se=2026-11-08T08%3A13%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=01b63950-6d1a-5279-90d9-6d8a3ed9b775&skoid=b9a47e8b-72a2-4ed3-8028-a2a98c1a6142&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-07T23%3A20%3A40Z&ske=2026-11-08T23%3A20%3A40Z&sks=b&skv=2026-02-06&sig=XHm0X3yfHvgBChTb/P10tlmoRqr6zI1a0wzLj/YR314%3D'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/rc7-20261108
          fetch-depth: 1
      - name: Download original files and verify all archive members
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, os, stat, tarfile, urllib.request, zipfile
          from pathlib import Path, PurePosixPath
          work = Path(os.environ['RUNNER_TEMP']) / 'rc7-release'
          work.mkdir()
          blob = work / 'bundle.zip'
          with urllib.request.urlopen(os.environ['BUNDLE_URL'], timeout=90) as response, blob.open('wb') as out:
              while block := response.read(1024 * 1024):
                  out.write(block)
          assert blob.stat().st_size == 75253298, 'Bundle size mismatch'
          assert hashlib.sha256(blob.read_bytes()).hexdigest() == os.environ['BUNDLE_SHA256'], 'Bundle digest mismatch'
          dist = work / 'dist'; dist.mkdir()
          with zipfile.ZipFile(blob) as archive:
              names = archive.namelist()
              assert len(names) == len(set(names)) == 7
              for name in names:
                  assert PurePosixPath(name).name == name and '\\' not in name
                  (dist / name).write_bytes(archive.read(name))
          manifest = json.loads((dist / 'release-manifest.json').read_text())
          assert manifest['version'] == '0.10.0-rc.7'
          for item in manifest['artifacts']:
              p = dist / item['name']
              assert p.stat().st_size == item['size'], item['name']
              assert hashlib.sha256(p.read_bytes()).hexdigest() == item['sha256'], item['name']
          sources = {}; modes = {}
          prefix = 'dsh-academic-ppt-0.10.0-rc.7/'
          allowed = {'src','bin','skills','examples','docs','evals','test','scripts','.npmignore','LICENSE','README.md','THIRD_PARTY_NOTICES.md','cordis.patch.yml','package.json','package-lock.json'}
          with zipfile.ZipFile(dist / 'dsh-academic-ppt-0.10.0-rc.7-source.zip') as archive:
              for item in archive.infolist():
                  if item.is_dir(): continue
                  assert item.filename.startswith(prefix)
                  name = item.filename[len(prefix):]; p = PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in name and ':' not in name
                  assert p.parts[0] in allowed and not stat.S_ISLNK(item.external_attr >> 16)
                  assert p.suffix.lower() not in {'.otf','.ttf','.woff','.woff2','.pem','.key'}
                  assert name not in sources
                  sources[name] = archive.read(item)
                  modes[name] = 0o755 if (item.external_attr >> 16) & 0o111 else 0o644
          assert len(sources) == manifest['source_file_count'] == 802
          assert json.loads(sources['package.json'])['version'] == '0.10.0-rc.7'
          count = 0
          with tarfile.open(dist / 'dsh-academic-ppt-0.10.0-rc.7.tgz', 'r:gz') as archive:
              for item in archive:
                  if item.isdir(): continue
                  assert item.isfile() and item.name.startswith('package/')
                  name = item.name[len('package/'):]
                  assert name in sources and sources[name] == archive.extractfile(item).read(), name
                  count += 1
          assert count == manifest['installer_file_count'] == 800
          stage = work / 'source'; stage.mkdir()
          for name, data in sources.items():
              p = stage / name; p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data); p.chmod(modes[name])
          print('Verified 802 source files and 800 matching installer files.')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('RC7_WORK=' + str(work) + '\n')
          PY
      - name: Preserve exact RC7 source on the isolated release branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$RELEASE_BRANCH"
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          work = Path(os.environ['RC7_WORK']); root = Path.cwd()
          for name in ('src','bin','skills','examples','docs','evals','test','scripts'):
              p = root / name
              if p.exists(): shutil.rmtree(p)
          if (root / '.publication').exists(): shutil.rmtree(root / '.publication')
          for p in (work / 'source').rglob('*'):
              if p.is_file():
                  target = root / p.relative_to(work / 'source')
                  target.parent.mkdir(parents=True, exist_ok=True); shutil.copy2(p, target)
                  assert target.read_bytes() == p.read_bytes()
          records = root / 'release-records' / '0.10.0-rc.7'; records.mkdir(parents=True, exist_ok=True)
          for name in ('release-manifest.json','SHA256SUMS','RELEASE_NOTES.md'):
              shutil.copy2(work / 'dist' / name, records / name)
          # The temporary delivery URL must not remain in the release snapshot.
          (root / '.github/workflows/publish-rc7-original.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'release: preserve original RC7 source and release checksums [skip ci]'
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          RC7_SOURCE_SHA="$(git rev-parse HEAD)"
          echo "RC7_SOURCE_SHA=$RC7_SOURCE_SHA" >> "$GITHUB_ENV"
          test -z "$(git ls-remote --tags origin "refs/tags/$TAG")"
          git tag "$TAG" "$RC7_SOURCE_SHA"
          git push origin "refs/tags/$TAG"
      - name: Upload assets, verify server digests, then publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          DIST="$RC7_WORK/dist"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --latest=false --title 'v0.10.0-rc.7 · 完整安装包与源码（预发布）' --notes-file "$DIST/RELEASE_NOTES.md"
          gh release upload "$TAG" "$DIST"/* --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId > "$RC7_WORK/release-id.json"
          RELEASE_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["databaseId"])' "$RC7_WORK/release-id.json")"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RC7_WORK/uploaded.json"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          work = Path(os.environ['RC7_WORK']); dist = work / 'dist'
          data = json.loads((work / 'uploaded.json').read_text())
          assert data['draft'] and data['prerelease'] and data['tag_name'] == os.environ['TAG']
          assets = {a['name']:a for a in data['assets']}
          assert set(assets) == {p.name for p in dist.iterdir() if p.is_file()}
          for name, asset in assets.items():
              p = dist / name
              assert asset['state'] == 'uploaded' and asset['size'] == p.stat().st_size, name
              assert asset.get('digest') == 'sha256:' + hashlib.sha256(p.read_bytes()).hexdigest(), name
          print('GitHub verified all 7 asset sizes and SHA-256 digests.')
          (work / 'publish.json').write_text(json.dumps({'draft':False,'prerelease':True,'make_latest':'false'}))
          PY
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --input "$RC7_WORK/publish.json" > "$RC7_WORK/published.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          work = Path(os.environ['RC7_WORK']); data = json.loads((work / 'published.json').read_text())
          assert not data['draft'] and data['prerelease'] and data['published_at']
          print(data['html_url'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## RC7 published\n\n' + data['html_url'] + '\n\n')
              out.write('Source commit: `' + os.environ['RC7_SOURCE_SHA'] + '`\n\n')
              for asset in data['assets']:
                  out.write('- [' + asset['name'] + '](' + asset['browser_download_url'] + ') — ' + str(asset['size']) + ' bytes, `' + asset['digest'] + '`\n')
          PY
